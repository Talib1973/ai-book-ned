<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2e8555;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#25c2a0;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Robot head outline -->
  <rect x="50" y="40" width="100" height="80" rx="10" fill="url(#gradient)" stroke="#1a5c3d" stroke-width="3"/>

  <!-- Eyes -->
  <circle cx="75" cy="70" r="8" fill="#ffffff"/>
  <circle cx="125" cy="70" r="8" fill="#ffffff"/>
  <circle cx="75" cy="70" r="4" fill="#1a5c3d"/>
  <circle cx="125" cy="70" r="4" fill="#1a5c3d"/>

  <!-- Antenna -->
  <line x1="100" y1="40" x2="100" y2="20" stroke="#1a5c3d" stroke-width="3"/>
  <circle cx="100" cy="20" r="5" fill="#25c2a0"/>

  <!-- Mouth/display -->
  <rect x="70" y="95" width="60" height="15" rx="5" fill="#1a5c3d"/>
  <line x1="75" y1="102" x2="85" y2="102" stroke="#25c2a0" stroke-width="2"/>
  <line x1="90" y1="102" x2="100" y2="102" stroke="#25c2a0" stroke-width="2"/>
  <line x1="105" y1="102" x2="115" y2="102" stroke="#25c2a0" stroke-width="2"/>
  <line x1="120" y1="102" x2="125" y2="102" stroke="#25c2a0" stroke-width="2"/>

  <!-- Body -->
  <rect x="60" y="120" width="80" height="60" rx="8" fill="url(#gradient)" stroke="#1a5c3d" stroke-width="3"/>

  <!-- Arms -->
  <rect x="30" y="130" width="30" height="40" rx="8" fill="#2e8555" stroke="#1a5c3d" stroke-width="2"/>
  <rect x="140" y="130" width="30" height="40" rx="8" fill="#2e8555" stroke="#1a5c3d" stroke-width="2"/>

  <!-- Chest indicator -->
  <circle cx="100" cy="150" r="12" fill="#1a5c3d"/>
  <path d="M 95 150 L 100 145 L 105 150 L 100 155 Z" fill="#25c2a0"/>

  <!-- Text -->
  <text x="100" y="195" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a5c3d">Physical AI</text>
</svg>
